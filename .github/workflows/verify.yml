name: Validate Telegram downloader
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and tests
        shell: bash
        run: |
          if [ -f bot.py ]; then
            python -m py_compile bot.py
            python -m unittest -v test_bot
          else
            echo 'BLOCKED: bot.py is not yet imported from the audited archive'
            exit 1
          fi
  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and unit tests
        shell: bash
        run: |
          if [ -f rednote-downloader/package.json ]; then
            cd rednote-downloader
            npm test
            npm run check:syntax --if-present
          else
            echo 'BLOCKED: rednote-downloader source is not yet imported from the audited archive'
            exit 1
          fi
