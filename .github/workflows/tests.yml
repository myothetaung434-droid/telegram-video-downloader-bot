name: Telegram Bot Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python runtime dependencies
        run: python -m pip install requests
      - name: Verify and run Python tests
        run: |
          test -f bot.py || { echo 'Missing bot.py'; exit 1; }
          test -f test_bot.py || { echo 'Missing test_bot.py'; exit 1; }
          python -m py_compile bot.py
          python -m unittest discover -p 'test_bot.py' -v
  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify and run JavaScript tests
        working-directory: rednote-downloader
        run: |
          test -f package.json || { echo 'Missing downloader package.json'; exit 1; }
          npm run check:syntax
          npm test
